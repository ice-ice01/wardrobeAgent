name: wardrobe-agent

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wardrobe_agent
      MYSQL_USER: wardrobe
      MYSQL_PASSWORD: ${WARDROBE_DB_PASSWORD:-wardrobe_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wardrobe_root_local_password}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build: ./backend
    environment:
      WARDROBE_DB_URL: jdbc:mysql://mysql:3306/wardrobe_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      WARDROBE_DB_USERNAME: wardrobe
      WARDROBE_DB_PASSWORD: ${WARDROBE_DB_PASSWORD:-wardrobe_local_password}
      WARDROBE_JWT_SECRET: ${WARDROBE_JWT_SECRET:-replace-this-local-compose-secret-before-deploying-2026}
      WARDROBE_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8088
      WARDROBE_MEDIA_ROOT: /app/data/media
      AI_MODE: ${AI_MODE:-mock}
      AI_SEMANTIC_RETRIEVAL_ENABLED: ${AI_SEMANTIC_RETRIEVAL_ENABLED:-false}
      AI_MULTIMODAL_ENABLED: ${AI_MULTIMODAL_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-missing}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com}
      AI_CHAT_BASE_URL: ${AI_CHAT_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-gpt-image-1}
      AI_IMAGE_SIZE: ${AI_IMAGE_SIZE:-1024x1024}
      AI_IMAGE_QUALITY: ${AI_IMAGE_QUALITY:-low}
      TRYON_PROVIDER: ${TRYON_PROVIDER:-MOCK}
      TRYON_REAL_ENABLED: ${TRYON_REAL_ENABLED:-false}
      FASHN_API_KEY: ${FASHN_API_KEY:-}
      TRYON_SPRING_AI_FALLBACK_ENABLED: ${TRYON_SPRING_AI_FALLBACK_ENABLED:-false}
    volumes:
      - media-data:/app/data/media
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  frontend:
    build: ./frontend
    ports:
      - "${WARDROBE_HTTP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  media-data:
